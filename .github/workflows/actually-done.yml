name: actually-done

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: actually-done full tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # A PR cannot affect this check's result: it reads base's checkout, fixed
      # to the PR's base sha, which the PR's own changes can never touch.
      #
      # "bootstrap" means base has never had this workflow at all - the PR that
      # first introduces actually-done's CI to this repo. There's no prior base
      # for the check to defend yet, so it's skipped rather than failed; every
      # PR after that one has this file on base and runs for real. This is
      # deliberately NOT keyed on base having a pyproject.toml: a base that
      # already runs this workflow but happens to lack one (or a PR that
      # deletes its own) still gets checked for real, just without a manifest
      # to pin the grader's version from - see the next two steps.
      - name: Check whether this is the PR that bootstraps the project
        id: base-check
        run: |
          if [ -f base/.github/workflows/actually-done.yml ]; then
            echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          else
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f base/pyproject.toml ]; then
            echo "has_manifest=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifest=false" >> "$GITHUB_OUTPUT"
          fi

      # The grader (actually-done itself, pytest) is installed from base's own
      # manifest, never the PR's, into its OWN venv - never the PR's - and
      # invoked afterward by absolute path. Not just "a PR can't bump or patch
      # its way around the thing that's grading it" (true either way): a PR
      # installed into the SAME environment as the grader could replace it
      # outright - a package it ships named `actually-done`, a `.pth` file, or
      # a `sitecustomize.py` can all override what `import actually_done`
      # resolves to for anything sharing that environment, including the
      # grader itself. A separate venv the PR's own install never touches
      # closes that regardless of what the PR's install does. See
      # docs/DECISIONS.md, D19/D20 - D20 reproduces exactly this attack
      # against both the unisolated and isolated designs to confirm it.
      - name: Create the grader's own venv, install actually-done from base
        if: steps.base-check.outputs.bootstrap == 'false' && steps.base-check.outputs.has_manifest == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/grader-venv"
          "$RUNNER_TEMP/grader-venv/bin/pip" install -e "./base[dev]"

      # base has no pyproject.toml to pin a grader version from (but does have
      # this workflow, so it's not a bootstrap base) - fall back to an unpinned
      # pytest in the grader's own venv rather than skipping, so base's own
      # tests still get checked for real. actually-done's own config already
      # defaults sanely when [tool.actually-done] is missing too (config.py).
      - name: Create the grader's own venv with a default (unpinned) grader
        if: steps.base-check.outputs.bootstrap == 'false' && steps.base-check.outputs.has_manifest == 'false'
        run: |
          python -m venv "$RUNNER_TEMP/grader-venv"
          "$RUNNER_TEMP/grader-venv/bin/pip" install pytest

      # The PR's own runtime dependencies go into a SEPARATE venv from the
      # grader's - never shared - so the sandboxed test run can still import
      # the PR's production code, without the PR's own install ever sharing an
      # environment (and so a site-packages, a .pth, or any import machinery)
      # with the grader. pytest itself runs IN this venv, not the grader's -
      # pinned to the exact version the grader's own venv resolved, read back
      # via `pip freeze`, so a PR can't supply a different pytest either.
      # Adjust the `pip install -e ./pr` line if your project isn't
      # pip-installable as-is.
      - name: Create the PR's own venv with its deps and a matching pytest
        if: steps.base-check.outputs.bootstrap == 'false'
        run: |
          python -m venv "$RUNNER_TEMP/pr-venv"
          "$RUNNER_TEMP/pr-venv/bin/pip" install -e ./pr
          "$RUNNER_TEMP/grader-venv/bin/pip" freeze | grep -i '^pytest==' > "$RUNNER_TEMP/pytest-pin.txt"
          "$RUNNER_TEMP/pr-venv/bin/pip" install -r "$RUNNER_TEMP/pytest-pin.txt"

      - name: Run full-tier verification
        if: steps.base-check.outputs.bootstrap == 'false'
        working-directory: pr
        run: |
          set -o pipefail
          "$RUNNER_TEMP/grader-venv/bin/actually-done" verify --tier full --base ../base \
            --python "$RUNNER_TEMP/pr-venv/bin/python" | tee ../evidence.md

      - name: Note the bootstrap skip
        if: steps.base-check.outputs.bootstrap == 'true'
        run: |
          cat > evidence.md <<'EOF'
          ## actually-done full tier

          **BOOTSTRAP: not verified.** Base branch has no
          `.github/workflows/actually-done.yml` yet, so this is the PR that
          introduces actually-done's CI to this repo - there's no prior base for
          this check to defend, so verification was skipped. Every PR after this
          one has this PR's own workflow file on base and runs the real check.
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actually-done-evidence
          path: evidence.md
          retention-days: 14

  comment:
    name: Post evidence to the PR
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actually-done-evidence

      # Runs with no checkout of PR-controlled code at all, and only this job (not
      # "verify") holds pull-requests: write - the evidence it posts is a file the
      # other job produced, not anything this job executes itself. Fork PRs may not
      # grant this job write access; the verify job's own pass/fail still gates the
      # merge either way.
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file evidence.md
