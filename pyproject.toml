[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "actually-done"
version = "0.1.0"
description = "Make your coding agent prove it's done."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
actually-done = "actually_done.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-testmon>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/actually_done"]

[tool.actually-done]
unit_test_path = "tests/unit"
fast_timeout_seconds = 50

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
