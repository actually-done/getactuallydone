name: actually-done

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: actually-done full tier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr

      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The grader (actually-done itself, pytest, any test-tooling plugins) is
      # installed from base's own manifest, never the PR's - a PR can't bump or
      # patch its way around the thing that's grading it. See docs/DECISIONS.md.
      - name: Install the grader from base
        working-directory: base
        run: pip install -e ".[dev]"

      # The PR's own runtime dependencies still need to be present so the sandboxed
      # test run can import the PR's production code. Adjust this if your project
      # isn't pip-installable as-is.
      - name: Install PR runtime dependencies
        working-directory: pr
        run: pip install -e .

      - name: Run full-tier verification
        working-directory: pr
        run: |
          set -o pipefail
          actually-done verify --tier full --base ../base | tee ../evidence.md

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actually-done-evidence
          path: evidence.md
          retention-days: 14

  comment:
    name: Post evidence to the PR
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Download evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: actually-done-evidence

      # Runs with no checkout of PR-controlled code at all, and only this job (not
      # "verify") holds pull-requests: write - the evidence it posts is a file the
      # other job produced, not anything this job executes itself. Fork PRs may not
      # grant this job write access; the verify job's own pass/fail still gates the
      # merge either way.
      - name: Post comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file evidence.md
